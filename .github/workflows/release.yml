name: Release

# Builds every distributable and publishes a GitHub Release:
#   - Python wheel + sdist (optionally to PyPI)
#   - single-file executables: Windows .exe, Linux x86_64/arm64, macOS arm64/x86_64 (PyInstaller)
#   - Windows installer (Inno Setup)
#   - .deb and .rpm packages with a systemd service (nFPM)
#   - multi-arch Docker image on ghcr.io
#
# Trigger: push a tag like v0.2.0, or run manually (manual runs build the artifacts
# and skip publishing unless "publish" is ticked).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.2.0); defaults to openbi/__init__.py"
        required: false
      publish:
        description: "Publish a GitHub Release, Docker image and (if enabled) PyPI package"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NFPM_VERSION: "2.43.0"

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            publish=true
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
            publish="${{ inputs.publish }}"
          else
            version=$(python3 -c 'import re;print(re.search(r"__version__ = \"(.+?)\"", open("openbi/__init__.py").read())[1])')
            publish="${{ inputs.publish }}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-]?(a|b|rc|dev)[0-9]+)?$ ]]; then
            echo "::error::invalid version '$version'"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=${publish:-false}" >> "$GITHUB_OUTPUT"
          echo "Building OpenBI $version (publish: ${publish:-false})"

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - run: ruff check openbi tests
      - run: ruff format --check openbi tests
      - run: pytest -q

  python:
    name: Wheel and sdist
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Stamp version
        run: sed -i -E 's/^__version__ = ".*"/__version__ = "${{ needs.version.outputs.version }}"/' openbi/__init__.py
      - run: pip install build
      - run: python -m build
      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/openbi --version
          test -f "$(/tmp/wheel-venv/bin/python -c 'import openbi, pathlib; print(pathlib.Path(openbi.__file__).parent / "web/static/index.html")')"
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  binaries:
    name: Executable (${{ matrix.target }})
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, os: ubuntu-22.04, exe: openbi }
          - { target: linux-arm64, os: ubuntu-22.04-arm, exe: openbi }
          - { target: windows-x86_64, os: windows-latest, exe: openbi.exe }
          - { target: macos-arm64, os: macos-15, exe: openbi }
          - { target: macos-x86_64, os: macos-15-intel, exe: openbi }
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Stamp version
        run: python -c "import re,pathlib;p=pathlib.Path('openbi/__init__.py');p.write_text(re.sub(r'__version__ = \".*\"','__version__ = \"${{ needs.version.outputs.version }}\"',p.read_text()))"
      - run: pip install . pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean packaging/openbi.spec
      - name: Smoke test
        run: |
          ./dist/${{ matrix.exe }} --version
          ./dist/${{ matrix.exe }} sample smoke --orders 300
          ./dist/${{ matrix.exe }} validate smoke
          ./dist/${{ matrix.exe }} refresh smoke
          ./dist/${{ matrix.exe }} query smoke "Product[Category]" "[Total Sales]" "[% of All Sales]"
      - name: Smoke test the web service
        run: |
          export OPENBI_HOME="$RUNNER_TEMP/openbi-home"
          ./dist/${{ matrix.exe }} demo --no-serve
          ./dist/${{ matrix.exe }} serve --port 8799 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8799/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:8799/static/vendor/echarts.min.js -o /dev/null
          token=$(curl -sf http://127.0.0.1:8799/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"openbi-admin"}' | python -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          curl -sf http://127.0.0.1:8799/api/datasets/1/query -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' -d '{"select":["Region[Region]","[Total Sales]"]}'
          kill %1 || true
      - name: Package
        run: |
          name="openbi-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p release "$name"
          cp "dist/${{ matrix.exe }}" LICENSE README.md "$name/"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp dist/openbi.exe "release/$name.exe"
            7z a "release/$name.zip" "$name" > /dev/null
          else
            tar czf "release/$name.tar.gz" "$name"
          fi
          ls -la release
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
      # raw binary for the .deb/.rpm and installer jobs
      - uses: actions/upload-artifact@v7
        with:
          name: raw-${{ matrix.target }}
          path: dist/${{ matrix.exe }}
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    needs: [version, binaries]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: raw-windows-x86_64
          path: dist
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ needs.version.outputs.version }}" "/DSourceExe=$PWD\dist\openbi.exe" "/DOutputDir=$PWD\release" packaging\windows\openbi.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem release
      - name: Silent install smoke test
        shell: pwsh
        run: |
          $setup = Get-ChildItem release\*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/DIR=$env:RUNNER_TEMP\openbi" -Wait
          & "$env:RUNNER_TEMP\openbi\openbi.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: bin-windows-installer
          path: release/*-setup.exe
          if-no-files-found: error

  linux-packages:
    name: .deb and .rpm (${{ matrix.arch }})
    needs: [version, binaries]
    strategy:
      matrix:
        include:
          - { arch: amd64, target: linux-x86_64, runner: ubuntu-latest, nfpm: x86_64 }
          - { arch: arm64, target: linux-arm64, runner: ubuntu-24.04-arm, nfpm: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: raw-${{ matrix.target }}
          path: build/linux
      - name: Install nFPM
        run: |
          curl -sSfL -o /tmp/nfpm.tgz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm }}.tar.gz"
          sudo tar xzf /tmp/nfpm.tgz -C /usr/local/bin nfpm
      - name: Build packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          chmod +x build/linux/openbi
          mkdir -p release
          nfpm package -f packaging/nfpm.yaml -p deb -t release/
          nfpm package -f packaging/nfpm.yaml -p rpm -t release/
          ls -la release
      - name: Install smoke test (.deb)
        run: |
          sudo apt-get install -y ./release/*.deb
          id openbi
          sudo -u openbi OPENBI_HOME=/var/lib/openbi openbi create-user ci@example.com --admin --password ci-password-123
          openbi --version
          sudo apt-get remove -y openbi
      - uses: actions/upload-artifact@v7
        with:
          name: bin-linux-packages-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  docker:
    name: Docker image
    needs: [version, test]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version
        run: sed -i -E 's/^__version__ = ".*"/__version__ = "${{ needs.version.outputs.version }}"/' openbi/__init__.py
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.version.outputs.version, 'a') && !contains(needs.version.outputs.version, 'b') && !contains(needs.version.outputs.version, 'rc') }}
          labels: |
            org.opencontainers.image.title=OpenBI
            org.opencontainers.image.description=Open-source business intelligence: data prep, DAX semantic models, interactive reports, RLS and embedding
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub Release
    needs: [version, python, binaries, windows-installer, linux-packages]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: release
      - name: Checksums
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: OpenBI ${{ needs.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.version.outputs.version, 'a') || contains(needs.version.outputs.version, 'b') || contains(needs.version.outputs.version, 'rc') }}
          files: release/*
          body: |
            ## Downloads

            | Platform | File |
            |---|---|
            | Windows | `openbi-${{ needs.version.outputs.version }}-windows-x86_64-setup.exe` (installer) or `…-windows-x86_64.exe` (portable) |
            | Debian / Ubuntu | `openbi_${{ needs.version.outputs.version }}_amd64.deb` / `_arm64.deb`, then `sudo systemctl enable --now openbi` |
            | Fedora / RHEL / SUSE | `openbi-${{ needs.version.outputs.version }}-1.x86_64.rpm` / `.aarch64.rpm` |
            | macOS | `…-macos-arm64.tar.gz` (Apple silicon) / `…-macos-x86_64.tar.gz` (Intel) |
            | Linux (any distro) | `…-linux-x86_64.tar.gz` / `…-linux-arm64.tar.gz` |
            | Python | `pip install openbi-${{ needs.version.outputs.version }}-py3-none-any.whl` |
            | Docker | `docker run -p 8000:8000 ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}` |

            Quick try: `openbi demo` then open http://127.0.0.1:8000 (admin@example.com / openbi-admin).
            The macOS binaries are not notarized: run `xattr -d com.apple.quarantine openbi` after extracting.

  pypi:
    name: PyPI
    needs: [version, python, github-release]
    # Enable by creating the repository variable PUBLISH_PYPI=true and a PyPI
    # trusted publisher for this workflow (environment "pypi").
    if: needs.version.outputs.publish == 'true' && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
