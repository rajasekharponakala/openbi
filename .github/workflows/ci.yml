name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check openbi tests
      - run: ruff format --check openbi tests
      - run: pytest -q
      - run: |
          openbi sample /tmp/sample
          openbi validate /tmp/sample
          openbi refresh /tmp/sample
          openbi query /tmp/sample "Product[Category]" "[Total Sales]" "[% of All Sales]"
