name: Label pull requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # labels are computed from changed paths only; no PR code is checked out or run
      - uses: actions/labeler@v5
        with:
          sync-labels: false
