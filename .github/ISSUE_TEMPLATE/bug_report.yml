name: Bug report
description: Something doesn't work as expected
labels: ["type: bug", "status: needs-triage"]
body:
  - type: textarea
    id: what
    attributes: { label: "What happened?", description: Include the measure / query / report steps if relevant. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: "What did you expect?" }
  - type: input
    id: version
    attributes: { label: OpenBI version, description: Output of `openbi --version` }
    validations: { required: true }
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options: [Windows installer / exe, .deb, .rpm, macOS binary, Docker, pip / wheel, from source]
  - type: textarea
    id: logs
    attributes: { label: Logs or error output, render: text }
